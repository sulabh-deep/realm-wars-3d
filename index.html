<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Realm Wars 3D</title><style>html,body{margin:0;height:100%;overflow:hidden;background:#78b9dc}canvas{display:block}</style></head><body><script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script><script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script><script>
const scene=new THREE.Scene();scene.background=new THREE.Color(0x78b9dc);scene.fog=new THREE.Fog(0x78b9dc,100,190);const camera=new THREE.PerspectiveCamera(55,innerWidth/innerHeight,.1,500);const renderer=new THREE.WebGLRenderer({antialias:true});renderer.setSize(innerWidth,innerHeight);renderer.setPixelRatio(Math.min(devicePixelRatio,1.5));renderer.outputEncoding=THREE.sRGBEncoding;renderer.toneMapping=THREE.NoToneMapping;renderer.shadowMap.enabled=true;document.body.appendChild(renderer.domElement);
scene.add(new THREE.HemisphereLight(0xffffff,0x49653c,.45));const sun=new THREE.DirectionalLight(0xffffff,.5);sun.position.set(-30,60,25);sun.castShadow=true;sun.shadow.mapSize.set(1024,1024);scene.add(sun);const ground=new THREE.Mesh(new THREE.PlaneGeometry(180,180),new THREE.MeshBasicMaterial({color:0x79a94f}));ground.rotation.x=-Math.PI/2;scene.add(ground);
const loader=new THREE.GLTFLoader();const world=new THREE.Group();scene.add(world);function mat(c,r=.82){return new THREE.MeshStandardMaterial({color:c,roughness:r,metalness:0,side:THREE.DoubleSide})}
function load(url,scale,x,z,type){loader.load(url,g=>{const r=g.scene||g.scenes[0];r.scale.setScalar(scale);r.position.set(x,0,z);r.updateMatrixWorld(true);const b=new THREE.Box3().setFromObject(r);r.position.y-=b.min.y;r.updateMatrixWorld(true);r.traverse(o=>{if(!o.isMesh)return;o.castShadow=true;o.receiveShadow=true;o.frustumCulled=false;if(type==='town'){const y=o.getWorldPosition(new THREE.Vector3()).y;let c=0xd8b16a;if(y>5)c=0x70452b;if(y>7)c=0x39c7d0;o.material=mat(c)}else if(type==='tree'){const h=b.max.y-b.min.y;o.material=mat(h>1.5?0x3f8b3d:0x6b4326)}else{o.material=mat(0xb88925,.35);o.material.metalness=.35}});world.add(r)},undefined,e=>console.error('GLB load failed',url,e))}
load('assets/town-center/stage1.glb?v=20260901-2',1.15,0,0,'town');for(let i=0;i<18;i++){const a=i*Math.PI*2/18,rad=30+(i%3)*5;load('assets/resources/tree.glb?v=20260901-2',1.05,Math.cos(a)*rad,Math.sin(a)*rad,'tree')}for(let i=0;i<6;i++){const a=i*Math.PI*2/6+.35,rad=42;load('assets/resources/gold-vein.glb?v=20260901-2',1.15,Math.cos(a)*rad,Math.sin(a)*rad,'gold')}
let angle=.65,dist=25,height=19;function updateCamera(){camera.position.set(Math.sin(angle)*dist,height,Math.cos(angle)*dist);camera.lookAt(0,3,0)}updateCamera();let dragging=false,lastX=0;renderer.domElement.addEventListener('pointerdown',e=>{if(e.button===0||e.button===1){dragging=true;lastX=e.clientX}});addEventListener('pointerup',()=>dragging=false);addEventListener('pointermove',e=>{if(dragging){angle+=(e.clientX-lastX)*.008;lastX=e.clientX;updateCamera()}});addEventListener('wheel',e=>{dist=Math.max(10,Math.min(70,dist+e.deltaY*.04));updateCamera()});addEventListener('keydown',e=>{if(e.key==='ArrowLeft')angle+=.1;if(e.key==='ArrowRight')angle-=.1;if(e.key==='ArrowUp')height=Math.min(60,height+2);if(e.key==='ArrowDown')height=Math.max(7,height-2);updateCamera()});addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});(function animate(){requestAnimationFrame(animate);renderer.render(scene,camera)})();</script></body></html>
