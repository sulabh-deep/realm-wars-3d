<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>Realm Wars 3D — RTS</title><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#78c8e5;font-family:monospace}#game{position:fixed;inset:0}canvas{display:block}#resources{position:fixed;top:0;left:0;right:0;height:42px;padding:8px 14px;background:rgba(20,16,12,.9);color:#fff;z-index:5;font-size:14px;white-space:nowrap}#status{position:fixed;left:50%;top:48px;transform:translateX(-50%);z-index:6;color:#fff;background:rgba(0,0,0,.68);padding:6px 10px;border-radius:4px;font-size:11px;pointer-events:none}.msg{position:fixed;left:50%;top:82px;transform:translateX(-50%);z-index:6;color:#ddd;background:rgba(0,0,0,.5);padding:4px 8px;border-radius:4px;font-size:10px;pointer-events:none}#ui{position:fixed;left:0;right:0;bottom:0;min-height:112px;padding:10px;display:flex;gap:8px;flex-wrap:wrap;align-content:center;background:rgba(25,18,12,.94);border-top:3px solid #8b6f47;z-index:5}.btn{background:#6b5335;color:#fff;border:2px solid #a98655;border-radius:4px;padding:10px 14px;font:14px monospace;touch-action:manipulation}.btn:active{background:#8b6f47}</style></head><body><div id="game"></div><div id="resources">🪵 <span id="rWood">250</span> &nbsp; 🍎 <span id="rFood">250</span> &nbsp; 🪙 <span id="rGold">150</span> &nbsp; 👥 <span id="rPop">3</span>/50</div><div id="status">Town Center: loading…</div><div class="msg">Drag to rotate • pinch/wheel to zoom • tap to select</div><div id="ui"><button class="btn" onclick="trainUnit('villager')">Villager · 50F</button><button class="btn" onclick="trainUnit('militia')">Militia · 60F 20G</button><button class="btn" onclick="trainUnit('archer')">Archer · 30W 40G</button><button class="btn" onclick="trainUnit('knight')">Knight · 80F 70G</button></div><script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script><script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script><script>
const scene=new THREE.Scene();scene.background=new THREE.Color(0x78c8e5);scene.fog=new THREE.Fog(0x78c8e5,90,220);const camera=new THREE.OrthographicCamera(-18,18,18,-18,.1,500);let zoom=18,angle=Math.PI*.25,dist=30;function updateCamera(){const x=Math.sin(angle)*dist,z=Math.cos(angle)*dist;camera.position.set(x,dist*.72,z);camera.lookAt(0,0,0);camera.zoom=18/zoom;camera.updateProjectionMatrix()}updateCamera();const renderer=new THREE.WebGLRenderer({antialias:true,powerPreference:'high-performance'});renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.setSize(innerWidth,innerHeight);renderer.outputEncoding=THREE.sRGBEncoding;renderer.shadowMap.enabled=true;document.getElementById('game').appendChild(renderer.domElement);scene.add(new THREE.HemisphereLight(0xddeeff,0x667755,.65));const sun=new THREE.DirectionalLight(0xffffff,.7);sun.position.set(30,50,20);sun.castShadow=true;sun.shadow.mapSize.set(1024,1024);scene.add(sun);const ground=new THREE.Mesh(new THREE.PlaneGeometry(220,220),new THREE.MeshLambertMaterial({color:0x79a45a}));ground.rotation.x=-Math.PI/2;ground.receiveShadow=true;scene.add(ground);
const RES={wood:250,food:250,gold:150},PLAYER=0,ENEMY=1;let units=[],buildings=[],resourceNodes=[],selected=[],pop=3;const TYPES={villager:{hp:40,dmg:3,range:0,speed:.08,cost:{food:50},color:0x4a90d9,size:.9},militia:{hp:60,dmg:8,range:0,speed:.09,cost:{food:60,gold:20},color:0xd94a4a,size:1},archer:{hp:45,dmg:6,range:8,speed:.095,cost:{wood:30,gold:40},color:0x7ad94a,size:.9},knight:{hp:120,dmg:14,range:0,speed:.11,cost:{food:80,gold:70},color:0xd9a44a,size:1.15}};const FACTIONS={0:{accent:0x3f5fa8,accentDark:0x2f467f},1:{accent:0xa83d46,accentDark:0x7f2b33}};const INITIAL={sandstone:0xc9b07a,stone:0x8c8470,roof:0x9a6a3a,wood:0x5a3925,gold:0xc29a3d,metal:0x6f5435};
function safeColor(mat,hex){if(mat&&mat.color&&mat.color.isColor)mat.color.setHex(hex)}function tintFaction(root,owner){const f=FACTIONS[owner]||FACTIONS[PLAYER],cache=new Map();root.traverse(o=>{if(!o.isMesh||!o.material)return;const arr=Array.isArray(o.material)?o.material:[o.material];o.material=arr.map(old=>{if(!old)return old;let m=cache.get(old);if(!m){try{m=old.clone();cache.set(old,m);const n=(m.name||'').toLowerCase();if(n.includes('sandstone'))safeColor(m,INITIAL.sandstone);else if(n.includes('stone'))safeColor(m,INITIAL.stone);else if(n.includes('roof'))safeColor(m,INITIAL.roof);else if(n.includes('wood'))safeColor(m,INITIAL.wood);else if(n.includes('gold')||n.includes('ore'))safeColor(m,INITIAL.gold);else if(n.includes('metal'))safeColor(m,INITIAL.metal);else if(n.includes('purple')||n.includes('turquoise')||n.includes('banner')||n.includes('awning')||n.includes('flag'))safeColor(m,f.accent);m.needsUpdate=true}catch(e){console.warn('Material tint skipped',e)}}return m});o.visible=true;o.frustumCulled=false;o.castShadow=true;o.receiveShadow=true})}
const loader=new THREE.GLTFLoader();function normalizeBuilding(root,targetFootprint){root.updateMatrixWorld(true);let b=new THREE.Box3().setFromObject(root),s=b.getSize(new THREE.Vector3());const f=Math.max(s.x,s.z);if(!isFinite(f)||f<=0)return;root.scale.multiplyScalar(targetFootprint/f);root.updateMatrixWorld(true);b.setFromObject(root);const c=b.getCenter(new THREE.Vector3());root.position.x-=c.x;root.position.z-=c.z;root.position.y-=b.min.y;root.updateMatrixWorld(true)}function normalizeResource(root,targetHeight){root.updateMatrixWorld(true);let b=new THREE.Box3().setFromObject(root),s=b.getSize(new THREE.Vector3());if(!isFinite(s.y)||s.y<=0)return;root.scale.multiplyScalar(targetHeight/s.y);root.updateMatrixWorld(true);b.setFromObject(root);root.position.y-=b.min.y;root.updateMatrixWorld(true)}
function tcFallback(owner){const g=new THREE.Group();const wall=new THREE.MeshLambertMaterial({color:INITIAL.sandstone}),wood=new THREE.MeshLambertMaterial({color:INITIAL.wood}),roof=new THREE.MeshLambertMaterial({color:INITIAL.roof}),accent=new THREE.MeshLambertMaterial({color:FACTIONS[owner].accent}),stone=new THREE.MeshLambertMaterial({color:INITIAL.stone});function box(s,p,m){const o=new THREE.Mesh(new THREE.BoxGeometry(...s),m);o.position.set(...p);o.castShadow=o.receiveShadow=true;g.add(o)}box([12,.6,12],[0,.3,0],stone);box([9,4.8,7],[0,2.7,.3],wall);box([1.8,6,1.8],[-5,3,-4.5],wall);box([1.8,6,1.8],[5,3,-4.5],wall);box([1.8,6,1.8],[-5,3,4.5],wall);box([1.8,6,1.8],[5,3,4.5],wall);box([10,.7,8],[0,5.6,.3],roof);const dom=new THREE.Mesh(new THREE.SphereGeometry(2.7,20,10),accent);dom.scale.y=.62;dom.position.set(0,7.1,.3);dom.castShadow=true;g.add(dom);const flag=new THREE.Mesh(new THREE.BoxGeometry(1.1,.65,.08),accent);flag.position.set(0,9.1,.3);g.add(flag);g.position.set(0,0,0);scene.add(g);return g}
function loadTC(x,z,owner,b,fall){loader.load('assets/town-center/stage1.glb?v=mobile-faction-2',g=>{const root=g.scene;root.visible=true;root.scale.setScalar(1);root.position.set(x,0,z);scene.add(root);try{normalizeBuilding(root,12);tintFaction(root,owner);b.mesh=root;fall.visible=false;status.textContent=owner===PLAYER?'Town Center ready':'Enemy Town Center ready';if(owner===PLAYER)setTimeout(()=>status.remove(),1200)}catch(err){console.error('Town Center setup failed',err);status.textContent='Town Center fallback active'}},undefined,e=>{console.error('Town Center GLB failed',e);status.textContent='Town Center fallback active'})}
function makeTC(x,z,owner){const b={x,z,hp:1000,owner,isBuilding:true,radius:7,mesh:null};buildings.push(b);const fall=tcFallback(owner);fall.position.set(x,0,z);loadTC(x,z,owner,b,fall)}
function loadResource(path,x,z,h){loader.load(path+'?v=mobile-faction-2',g=>{const r=g.scene;r.position.set(x,0,z);scene.add(r);normalizeResource(r,h);r.traverse(o=>{if(o.isMesh){o.visible=true;o.frustumCulled=false;o.castShadow=true;o.receiveShadow=true}})},undefined,e=>console.warn('Resource failed',path,e))}
function makeTree(x,z){loadResource('assets/resources/tree.glb',x,z,5);resourceNodes.push({x,z,amt:100,type:'wood'})}function makeGold(x,z){loadResource('assets/resources/gold-vein.glb',x,z,2);resourceNodes.push({x,z,amt:400,type:'gold'})}
makeTC(0,0,PLAYER);makeTC(32,-24,ENEMY);for(let i=0;i<12;i++)makeTree((Math.random()-.5)*100,(Math.random()-.5)*80);for(let i=0;i<4;i++)makeGold((Math.random()-.5)*90,(Math.random()-.5)*70);
function spawnUnit(type,owner,x,z){const t=TYPES[type],m=new THREE.Mesh(new THREE.SphereGeometry(t.size*.7,12,12),new THREE.MeshLambertMaterial({color:owner===PLAYER?t.color:0xc0392b}));m.position.set(x,t.size,z);m.castShadow=true;scene.add(m);const u={mesh:m,type,owner,x,z,hp:t.hp,maxHp:t.hp,target:null,gather:null,cooldown:0};units.push(u);if(owner===PLAYER){pop++;updateUI()}return u}for(let i=0;i<3;i++)spawnUnit('villager',PLAYER,-3+i*2,4);
const ring=new THREE.Mesh(new THREE.RingGeometry(1.3,1.65,24),new THREE.MeshBasicMaterial({color:0xffff88,side:THREE.DoubleSide}));ring.rotation.x=-Math.PI/2;ring.visible=false;scene.add(ring);const ray=new THREE.Raycaster(),mouse=new THREE.Vector2();function groundPoint(e){const r=renderer.domElement.getBoundingClientRect();mouse.x=((e.clientX-r.left)/r.width)*2-1;mouse.y=-((e.clientY-r.top)/r.height)*2+1;ray.setFromCamera(mouse,camera);const h=ray.intersectObject(ground)[0];return h?h.point:null}let dragging=false,lastX=0,lastY=0;renderer.domElement.addEventListener('pointerdown',e=>{if(e.button===2)return;dragging=false;lastX=e.clientX;lastY=e.clientY});renderer.domElement.addEventListener('pointermove',e=>{if(e.buttons===1){const dx=e.clientX-lastX,dy=e.clientY-lastY;if(Math.abs(dx)+Math.abs(dy)>3)dragging=true;if(dragging){angle-=dx*.008;lastX=e.clientX;lastY=e.clientY;updateCamera()}}});renderer.domElement.addEventListener('pointerup',e=>{if(dragging)return;const p=groundPoint(e);if(!p)return;selected=units.filter(u=>u.owner===PLAYER&&Math.hypot(u.x-p.x,u.z-p.z)<2.5);if(selected.length){ring.position.set(selected[0].x,.06,selected[0].z);ring.visible=true}else ring.visible=false});renderer.domElement.addEventListener('wheel',e=>{zoom=Math.max(9,Math.min(30,zoom+e.deltaY*.012));updateCamera()},{passive:true});renderer.domElement.addEventListener('contextmenu',e=>e.preventDefault());function updateUI(){rWood.textContent=Math.floor(RES.wood);rFood.textContent=Math.floor(RES.food);rGold.textContent=Math.floor(RES.gold);rPop.textContent=pop}function trainUnit(type){const t=TYPES[type];if(pop>=50||Object.keys(t.cost).some(k=>RES[k]<t.cost[k]))return;Object.keys(t.cost).forEach(k=>RES[k]-=t.cost[k]);const tc=buildings.find(b=>b.owner===PLAYER);if(tc)spawnUnit(type,PLAYER,tc.x+6,tc.z+5)}function animate(){requestAnimationFrame(animate);renderer.render(scene,camera)}animate();addEventListener('resize',()=>{renderer.setSize(innerWidth,innerHeight);updateCamera()});updateUI();</script></body></html>
