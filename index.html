<!doctype html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Realm Wars 3D</title>
<style>html,body{margin:0;height:100%;overflow:hidden;background:#111}canvas{display:block}</style></head><body>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
<script>
const scene=new THREE.Scene();
scene.background=new THREE.Color(0x83c9e8);
const camera=new THREE.PerspectiveCamera(50,innerWidth/innerHeight,.1,300);camera.position.set(24,18,24);
const renderer=new THREE.WebGLRenderer({antialias:true});renderer.setSize(innerWidth,innerHeight);renderer.setPixelRatio(Math.min(devicePixelRatio,1.8));renderer.shadowMap.enabled=true;renderer.outputEncoding=THREE.sRGBEncoding;document.body.appendChild(renderer.domElement);
scene.add(new THREE.HemisphereLight(0xd8efff,0x4c5b35,1.15));const sun=new THREE.DirectionalLight(0xffffff,1.35);sun.position.set(-25,45,25);sun.castShadow=true;sun.shadow.mapSize.set(2048,2048);scene.add(sun);
const ground=new THREE.Mesh(new THREE.PlaneGeometry(160,160),new THREE.MeshLambertMaterial({color:0x4f843e}));ground.rotation.x=-Math.PI/2;ground.receiveShadow=true;scene.add(ground);
const sandstone=new THREE.MeshStandardMaterial({color:0xd2a15c,roughness:.82,metalness:.02});const sandstoneLight=new THREE.MeshStandardMaterial({color:0xe0b873,roughness:.78,metalness:.02});const stone=new THREE.MeshStandardMaterial({color:0xbfa27a,roughness:.9});const wood=new THREE.MeshStandardMaterial({color:0x76502f,roughness:.9});const teal=new THREE.MeshStandardMaterial({color:0x35c6d0,roughness:.6});const purple=new THREE.MeshStandardMaterial({color:0x59358d,roughness:.7});const dark=new THREE.MeshStandardMaterial({color:0x3c2920,roughness:.95});
function addBox(parent,w,h,d,mat,x,y,z){const o=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),mat);o.position.set(x,y,z);o.castShadow=o.receiveShadow=true;parent.add(o);return o}
function addCylinder(parent,r1,r2,h,mat,x,y,z,n=12){const o=new THREE.Mesh(new THREE.CylinderGeometry(r1,r2,h,n),mat);o.position.set(x,y,z);o.castShadow=o.receiveShadow=true;parent.add(o);return o}
function crenels(parent,cx,cy,cz,w,d){const step=1.35;for(let x=-w/2+.55;x<=w/2-.55;x+=step){addBox(parent,.55,.7,.6,sandstoneLight,cx+x,cy,cz-d/2+.3);addBox(parent,.55,.7,.6,sandstoneLight,cx+x,cy,cz+d/2-.3)}for(let z=-d/2+1.1;z<=d/2-1.1;z+=step){addBox(parent,.6,.7,.55,sandstoneLight,cx-w/2+.3,cy,cz+z);addBox(parent,.6,.7,.55,sandstoneLight,cx+w/2-.3,cy,cz+z)}}
function dome(parent,x,y,z){addCylinder(parent,1.75,1.75,.35,sandstoneLight,x,y-.1,z);const d=new THREE.Mesh(new THREE.SphereGeometry(1.55,16,8,0,Math.PI*2,0,Math.PI/2),teal);d.position.set(x,y+.05,z);d.scale.y=.72;d.castShadow=d.receiveShadow=true;parent.add(d);addCylinder(parent,.08,.08,1.5,sandstoneLight,x,y+1.25,z,8);addBox(parent,.8,.38,.05,purple,x+.38,y+1.72,z)}
function tower(parent,x,z){addBox(parent,3.1,6.7,3.1,sandstone,x,3.35,z);addBox(parent,3.55,.65,3.55,sandstoneLight,x,6.65,z);crenels(parent,x,7.05,z,3.4,3.4);dome(parent,x,7.45,z);addBox(parent,3.35,.35,3.35,stone,x,.25,z)}
function banner(parent,x,z){addBox(parent,.75,1.8,.08,purple,x,4.15,z);addBox(parent,.9,.08,.12,sandstoneLight,x,5.1,z)}
function awning(parent,x,z){const a=addBox(parent,2.2,.12,1.15,teal,x,4.15,z);a.rotation.x=.18;for(let i=-.8;i<=.8;i+=.4)addBox(parent,.18,.65,.06,sandstoneLight,x+i,3.85,z-.48)}
function buildTownCenter(){
 const root=new THREE.Group();root.name='TownCenter';
 addBox(root,12,.45,12,stone,0,.22,0);addBox(root,10,5.8,7.8,sandstone,0,3.25,-.4);addBox(root,11.5,.8,8.8,sandstoneLight,0,6.05,-.4);crenels(root,0,6.55,-.4,11.5,8.8);
 // Front gate and open doorway
 addBox(root,2.9,4.3,.35,dark,0,2.2,4.55);addBox(root,2.0,6.4,1.0,sandstone,-3.7,3.2,5.15);addBox(root,2.0,6.4,1.0,sandstone,3.7,3.2,5.15);addBox(root,8.0,1.25,1.0,sandstoneLight,0,6.0,5.15);addBox(root,8.8,.6,1.2,sandstoneLight,0,6.75,5.15);for(let i=0;i<7;i++)addBox(root,.65,.5,1.0,sandstoneLight,(i-3)*1.0,7.1,5.15);
 tower(root,-7,-4);tower(root,7,-4);tower(root,-7,4.3);tower(root,7,4.3);
 for(let x=-4.5;x<=4.5;x+=3){awning(root,x,4.25);banner(root,x,5)}
 addBox(root,5.6,.35,1.5,wood,0,5.15,-4.75);for(let x=-2.4;x<=2.4;x+=.8)addBox(root,.12,1.0,1.2,wood,x,5.65,-4.75);addBox(root,7.8,.45,5.8,sandstoneLight,0,7.0,-.5);
 const status=document.createElement('div');status.style='position:fixed;top:12px;left:12px;padding:8px 12px;background:rgba(0,0,0,.72);color:#ffd66b;font:13px monospace;z-index:3';status.textContent='Loading Town Center roof GLB…';document.body.appendChild(status);
 new THREE.GLTFLoader().load('assets/town-center/stage1.glb',g=>{
  const roof=g.scene||g.scenes[0];roof.scale.set(1,1,1);roof.position.set(0,0,0);roof.updateMatrixWorld(true);let b=new THREE.Box3().setFromObject(roof);let s=b.getSize(new THREE.Vector3());const c=b.getCenter(new THREE.Vector3());const sc=10.8/Math.max(s.x,s.z,.001);roof.scale.setScalar(sc);roof.updateMatrixWorld(true);b=new THREE.Box3().setFromObject(roof);const cc=b.getCenter(new THREE.Vector3());roof.position.set(-cc.x,-b.min.y+7.25,-cc.z);roof.updateMatrixWorld(true);let count=0;
  roof.traverse(o=>{if(!o.isMesh)return;count++;o.visible=true;o.castShadow=true;o.receiveShadow=true;o.frustumCulled=false;o.material=new THREE.MeshStandardMaterial({color:0xd8aa65,roughness:.82,metalness:.02,side:THREE.DoubleSide,transparent:false,opacity:1,depthWrite:true,depthTest:true})});root.add(roof);status.textContent='Town Center complete — GLB roof + 3D structure';setTimeout(()=>status.remove(),2500);
  const all=new THREE.Box3().setFromObject(root);const sz=all.getSize(new THREE.Vector3()),rad=Math.max(sz.x,sz.z);camera.position.set(rad*1.42,Math.max(12,sz.y*.92),rad*1.42);camera.lookAt(0,sz.y*.42,0);console.log('Town Center meshes:',count,'bounds:',sz);
 },undefined,e=>{console.error('GLB failed:',e);status.textContent='GLB roof failed — 3D Town Center base loaded';const all=new THREE.Box3().setFromObject(root);const sz=all.getSize(new THREE.Vector3()),rad=Math.max(sz.x,sz.z);camera.position.set(rad*1.42,Math.max(12,sz.y*.92),rad*1.42);camera.lookAt(0,sz.y*.42,0)});
 scene.add(root);
}
buildTownCenter();
for(let x=-12;x<=12;x+=2)for(let z=9;z<=13;z+=2)addBox(scene,1.7,.12,1.7,stone,x,.07,z);
addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});function animate(){requestAnimationFrame(animate);renderer.render(scene,camera)}animate();
</script></body></html>
