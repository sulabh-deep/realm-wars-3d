<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Realm Wars 3D</title><style>html,body{margin:0;height:100%;overflow:hidden;background:#87ceeb}canvas{display:block}#status{position:fixed;top:10px;left:10px;z-index:5;padding:8px 12px;background:rgba(0,0,0,.72);color:#ffd66b;font:13px monospace}</style></head><body><div id="status">Loading Town Center…</div><script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script><script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script><script>
const scene=new THREE.Scene();scene.background=new THREE.Color(0x87ceeb);const camera=new THREE.PerspectiveCamera(55,innerWidth/innerHeight,.1,500);const renderer=new THREE.WebGLRenderer({antialias:true});renderer.setSize(innerWidth,innerHeight);renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.outputEncoding=THREE.sRGBEncoding;renderer.shadowMap.enabled=true;document.body.appendChild(renderer.domElement);scene.add(new THREE.HemisphereLight(0xffffff,0x557744,1.5));const sun=new THREE.DirectionalLight(0xffffff,1.4);sun.position.set(-30,60,25);sun.castShadow=true;scene.add(sun);const ground=new THREE.Mesh(new THREE.PlaneGeometry(180,180),new THREE.MeshLambertMaterial({color:0x4f843e}));ground.rotation.x=-Math.PI/2;ground.receiveShadow=true;scene.add(ground);
const sand=new THREE.MeshLambertMaterial({color:0xd5a55f}),light=new THREE.MeshLambertMaterial({color:0xe4bf78}),stone=new THREE.MeshLambertMaterial({color:0xbda37b}),wood=new THREE.MeshLambertMaterial({color:0x76502f}),teal=new THREE.MeshLambertMaterial({color:0x35c6d0}),purple=new THREE.MeshLambertMaterial({color:0x59358d}),dark=new THREE.MeshLambertMaterial({color:0x493020});function box(g,w,h,d,m,x,y,z){const o=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),m);o.position.set(x,y,z);o.castShadow=o.receiveShadow=true;g.add(o);return o}function tower(g,x,z){box(g,3.1,6.7,3.1,sand,x,3.35,z);box(g,3.55,.65,3.55,light,x,6.65,z);for(let i=-1;i<=1;i+=2){box(g,.65,.7,.65,light,x+i*1.15,7.05,z-1.15);box(g,.65,.7,.65,light,x+i*1.15,7.05,z+1.15)}const d=new THREE.Mesh(new THREE.SphereGeometry(1.55,16,8,0,Math.PI*2,0,Math.PI/2),teal);d.scale.y=.72;d.position.set(x,7.5,z);d.castShadow=true;g.add(d);box(g,.1,1.5,.1,light,x,9,z);box(g,.8,.38,.06,purple,x+.4,9.35,z)}function awning(g,x,z){const a=box(g,2.2,.12,1.15,teal,x,4.12,z);a.rotation.x=.18}function makeBase(){const g=new THREE.Group();box(g,12,.45,12,stone,0,.22,0);box(g,10,5.8,7.8,sand,0,3.25,-.35);box(g,11.5,.8,8.8,light,0,6.05,-.35);for(let x=-5.2;x<=5.2;x+=1.35){box(g,.55,.7,.6,light,x,6.55,-4.45);box(g,.55,.7,.6,light,x,6.55,3.75)}for(let z=-3.2;z<=2.8;z+=1.35){box(g,.6,.7,.55,light,-5.45,6.55,z);box(g,.6,.7,.55,light,5.45,6.55,z)}tower(g,-6.8,-3.9);tower(g,6.8,-3.9);tower(g,-6.8,4);tower(g,6.8,4);box(g,2.9,4.3,.3,dark,0,2.2,4.45);box(g,2,6.4,1,sand,-3.7,3.2,5.05);box(g,2,6.4,1,sand,3.7,3.2,5.05);box(g,8,1.25,1,light,0,6,5.05);for(let x=-4.5;x<=4.5;x+=3){awning(g,x,4.15);box(g,.75,1.8,.08,purple,x,4.95,4.85)}box(g,7.8,.45,5.8,light,0,7,-.45);scene.add(g);return g}const base=makeBase();
new THREE.GLTFLoader().load('assets/town-center/stage1.glb',g=>{const r=g.scene||g.scenes[0];r.scale.set(1,1,1);r.position.set(0,0,0);r.updateMatrixWorld(true);let b=new THREE.Box3().setFromObject(r),s=b.getSize(new THREE.Vector3()),c=b.getCenter(new THREE.Vector3());const sc=9.5/Math.max(s.x,s.z,.001);r.scale.setScalar(sc);r.updateMatrixWorld(true);b=new THREE.Box3().setFromObject(r);c=b.getCenter(new THREE.Vector3());r.position.set(-c.x,-b.min.y+7.2,-c.z);r.updateMatrixWorld(true);let count=0;r.traverse(o=>{if(!o.isMesh)return;count++;o.visible=true;o.castShadow=true;o.receiveShadow=true;o.frustumCulled=false;o.material=new THREE.MeshBasicMaterial({color:0xd8aa65,side:THREE.DoubleSide,transparent:false,opacity:1,depthWrite:true,depthTest:true})});base.add(r);b=new THREE.Box3().setFromObject(base);s=b.getSize(new THREE.Vector3());const rad=Math.max(s.x,s.z);camera.position.set(rad*1.4,Math.max(11,s.y*.9),rad*1.4);camera.lookAt(0,s.y*.4,0);document.getElementById('status').textContent='Town Center loaded — '+count+' GLB meshes';setTimeout(()=>document.getElementById('status').remove(),2200)},undefined,e=>{console.error(e);document.getElementById('status').textContent='GLB load failed — base remains'});
addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});function loop(){requestAnimationFrame(loop);renderer.render(scene,camera)}loop();</script></body></html>
