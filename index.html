<!doctype html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Realm Wars 3D</title><style>html,body{margin:0;height:100%;overflow:hidden;background:#111}canvas{display:block}</style></head><body><script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script><script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script><script>
const scene=new THREE.Scene();scene.background=new THREE.Color(0x83c9e8);const camera=new THREE.PerspectiveCamera(55,innerWidth/innerHeight,.1,500);camera.position.set(22,25,22);camera.lookAt(0,0,0);const renderer=new THREE.WebGLRenderer({antialias:true});renderer.setSize(innerWidth,innerHeight);renderer.shadowMap.enabled=true;document.body.appendChild(renderer.domElement);scene.add(new THREE.HemisphereLight(0xd8efff,0x4c5b35,.9));const sun=new THREE.DirectionalLight(0xffffff,1.1);sun.position.set(-30,60,20);sun.castShadow=true;scene.add(sun);const ground=new THREE.Mesh(new THREE.PlaneGeometry(180,180),new THREE.MeshLambertMaterial({color:0x4f843e}));ground.rotation.x=-Math.PI/2;ground.receiveShadow=true;scene.add(ground);
const loader=new THREE.GLTFLoader();const status=document.createElement('div');status.style='position:fixed;top:12px;left:12px;padding:8px 12px;background:rgba(0,0,0,.65);color:#ffd66b;font:13px monospace;z-index:3';status.textContent='Loading Town Center GLB…';document.body.appendChild(status);
loader.load('assets/town-center/stage1.glb',g=>{const m=g.scene||g.scenes[0];const box=new THREE.Box3().setFromObject(m);const size=box.getSize(new THREE.Vector3());const center=box.getCenter(new THREE.Vector3());m.position.set(-center.x,-box.min.y,-center.z);m.scale.setScalar(12/Math.max(size.x,size.z,.001));m.traverse(o=>{if(o.isMesh){o.castShadow=true;o.receiveShadow=true;o.frustumCulled=false;}});scene.add(m);status.textContent='Town Center GLB loaded';setTimeout(()=>status.remove(),1800)},undefined,e=>{status.textContent='GLB load failed: '+(e.message||'check assets path');console.error(e)});
addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});function a(){requestAnimationFrame(a);renderer.render(scene,camera)}a();
</script></body></html>
