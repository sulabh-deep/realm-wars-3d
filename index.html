<!doctype html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>Realm Wars 3D — RTS</title><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#78c8e5;font-family:monospace}#game{position:fixed;inset:0}canvas{display:block}#resources{position:fixed;top:0;left:0;right:0;height:42px;padding:8px 14px;background:rgba(20,16,12,.9);color:#fff;z-index:5;font-size:14px;white-space:nowrap}#ui{position:fixed;left:0;right:0;bottom:0;min-height:112px;padding:10px;display:flex;gap:8px;flex-wrap:wrap;align-content:center;background:rgba(25,18,12,.94);border-top:3px solid #8b6f47;z-index:5}.btn{background:#6b5335;color:#fff;border:2px solid #a98655;border-radius:4px;padding:10px 14px;font:14px monospace;touch-action:manipulation}.btn:active{background:#8b6f47}.hint{color:#ccc;font-size:11px;margin:4px 8px}.msg{position:fixed;left:50%;top:48px;transform:translateX(-50%);z-index:6;color:#fff;background:rgba(0,0,0,.65);padding:5px 9px;border-radius:4px;font-size:11px;pointer-events:none}</style></head><body><div id="game"></div><div id="resources">🪵 <span id="rWood">250</span> &nbsp; 🍎 <span id="rFood">250</span> &nbsp; 🪙 <span id="rGold">150</span> &nbsp; 👥 <span id="rPop">3</span>/50</div><div class="msg">Drag to rotate • pinch/wheel to zoom • tap to select</div><div id="ui"><button class="btn" onclick="trainUnit('villager')">Villager · 50F</button><button class="btn" onclick="trainUnit('militia')">Militia · 60F 20G</button><button class="btn" onclick="trainUnit('archer')">Archer · 30W 40G</button><button class="btn" onclick="trainUnit('knight')">Knight · 80F 70G</button></div><script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script><script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script><script>
const scene=new THREE.Scene();scene.background=new THREE.Color(0x78c8e5);scene.fog=new THREE.Fog(0x78c8e5,90,220);
const camera=new THREE.OrthographicCamera(-18,18,18,-18,.1,500);let zoom=18,angle=Math.PI*.25,dist=30;
function updateCamera(){const x=Math.sin(angle)*dist,z=Math.cos(angle)*dist;camera.position.set(x,dist*.72,z);camera.lookAt(0,0,0);camera.zoom=18/zoom;camera.updateProjectionMatrix()}updateCamera();
const renderer=new THREE.WebGLRenderer({antialias:true,powerPreference:'high-performance'});renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.setSize(innerWidth,innerHeight);renderer.outputEncoding=THREE.sRGBEncoding;renderer.shadowMap.enabled=true;document.getElementById('game').appendChild(renderer.domElement);
scene.add(new THREE.HemisphereLight(0xddeeff,0x667755,.65));const sun=new THREE.DirectionalLight(0xffffff,.7);sun.position.set(30,50,20);sun.castShadow=true;sun.shadow.mapSize.set(1024,1024);scene.add(sun);
const ground=new THREE.Mesh(new THREE.PlaneGeometry(220,220),new THREE.MeshLambertMaterial({color:0x79a45a}));ground.rotation.x=-Math.PI/2;ground.receiveShadow=true;scene.add(ground);
const RES={wood:250,food:250,gold:150},PLAYER=0,ENEMY=1;let units=[],buildings=[],resourceNodes=[],selected=[],pop=3,gameOver=false;
const TYPES={villager:{hp:40,dmg:3,range:0,speed:.08,cost:{food:50},color:0x4a90d9,size:.9,canGather:true},militia:{hp:60,dmg:8,range:0,speed:.09,cost:{food:60,gold:20},color:0xd94a4a,size:1},archer:{hp:45,dmg:6,range:8,speed:.095,cost:{wood:30,gold:40},color:0x7ad94a,size:.9},knight:{hp:120,dmg:14,range:0,speed:.11,cost:{food:80,gold:70},color:0xd9a44a,size:1.15}};
const loader=new THREE.GLTFLoader();function loadGLB(path,scale,pos,done){loader.load(path+'?v=mobile-rts-2',g=>{const root=g.scene;root.scale.setScalar(scale);root.position.set(pos.x,0,pos.z);root.traverse(o=>{if(o.isMesh){o.castShadow=true;o.receiveShadow=true;if(o.material){const ms=Array.isArray(o.material)?o.material:[o.material];ms.forEach(m=>{if(m){m.transparent=false;m.opacity=1;m.side=THREE.FrontSide}})}}});scene.add(root);done&&done(root)},undefined,e=>console.warn('GLB failed',path,e))}
function makeTree(x,z){loadGLB('assets/resources/tree.glb',1.8,{x,z});resourceNodes.push({x,z,amt:100,type:'wood',radius:2})}function makeGold(x,z){loadGLB('assets/resources/gold-vein.glb',1.8,{x,z});resourceNodes.push({x,z,amt:400,type:'gold',radius:2.5})}
function makeTC(x,z,owner){const b={x,z,hp:1000,owner,isBuilding:true,radius:6};buildings.push(b);loadGLB('assets/town-center/stage1.glb',1.15,{x,z},root=>{root.userData.building=b});return b}
makeTC(-10,8,PLAYER);makeTC(28,-20,ENEMY);for(let i=0;i<14;i++)makeTree((Math.random()-.5)*100,(Math.random()-.5)*80);for(let i=0;i<4;i++)makeGold((Math.random()-.5)*90,(Math.random()-.5)*70);
function spawnUnit(type,owner,x,z){const t=TYPES[type];const m=new THREE.Mesh(new THREE.SphereGeometry(t.size*.7,12,12),new THREE.MeshLambertMaterial({color:owner===PLAYER?t.color:0xc0392b}));m.position.set(x,t.size,z);m.castShadow=true;scene.add(m);const u={mesh:m,type,owner,x,z,hp:t.hp,maxHp:t.hp,target:null,gather:null,cooldown:0,isUnit:true};units.push(u);if(owner===PLAYER){pop++;updateUI()}return u}for(let i=0;i<3;i++)spawnUnit('villager',PLAYER,-7+i*2,5);
const ring=new THREE.Mesh(new THREE.RingGeometry(1.3,1.65,24),new THREE.MeshBasicMaterial({color:0xffff88,side:THREE.DoubleSide}));ring.rotation.x=-Math.PI/2;ring.visible=false;scene.add(ring);
const ray=new THREE.Raycaster(),mouse=new THREE.Vector2();function groundPoint(e){const r=renderer.domElement.getBoundingClientRect();mouse.x=((e.clientX-r.left)/r.width)*2-1;mouse.y=-((e.clientY-r.top)/r.height)*2+1;ray.setFromCamera(mouse,camera);const h=ray.intersectObject(ground)[0];return h?h.point:null}
let dragging=false,lastX=0,lastY=0;renderer.domElement.addEventListener('pointerdown',e=>{if(e.button===2)return;dragging=false;lastX=e.clientX;lastY=e.clientY});renderer.domElement.addEventListener('pointermove',e=>{if(e.buttons===1){const dx=e.clientX-lastX,dy=e.clientY-lastY;if(Math.abs(dx)+Math.abs(dy)>3)dragging=true;if(dragging){angle-=dx*.008;lastX=e.clientX;lastY=e.clientY;updateCamera()}}});renderer.domElement.addEventListener('pointerup',e=>{if(dragging)return;const p=groundPoint(e);if(!p)return;selected=units.filter(u=>u.owner===PLAYER&&Math.hypot(u.x-p.x,u.z-p.z)<2.5);if(selected.length){ring.position.set(selected[0].x,.06,selected[0].z);ring.visible=true}else ring.visible=false});renderer.domElement.addEventListener('contextmenu',e=>e.preventDefault());renderer.domElement.addEventListener('wheel',e=>{zoom=Math.max(8,Math.min(32,zoom+e.deltaY*.015));updateCamera()},{passive:true});
function updateUI(){rWood.textContent=Math.floor(RES.wood);rFood.textContent=Math.floor(RES.food);rGold.textContent=Math.floor(RES.gold);rPop.textContent=pop}function trainUnit(type){const t=TYPES[type];if(pop>=50||Object.keys(t.cost).some(k=>RES[k]<t.cost[k]))return;Object.keys(t.cost).forEach(k=>RES[k]-=t.cost[k]);const tc=buildings.find(b=>b.owner===PLAYER);spawnUnit(type,PLAYER,tc.x+4,tc.z+3);updateUI()}
function animate(){requestAnimationFrame(animate);renderer.render(scene,camera)}animate();addEventListener('resize',()=>{renderer.setSize(innerWidth,innerHeight);updateCamera()});updateUI();
</script></body></html>
