<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Realm Wars 3D</title><style>html,body{margin:0;height:100%;overflow:hidden;background:#87ceeb}canvas{display:block}#status{position:fixed;top:10px;left:10px;z-index:5;padding:8px 12px;background:rgba(0,0,0,.72);color:#ffd66b;font:13px monospace}</style></head><body><div id="status">Loading Realm Wars…</div><script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script><script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script><script>
const scene=new THREE.Scene();scene.background=new THREE.Color(0x87ceeb);scene.fog=new THREE.Fog(0x87ceeb,90,180);const camera=new THREE.PerspectiveCamera(55,innerWidth/innerHeight,.1,500);const renderer=new THREE.WebGLRenderer({antialias:true});renderer.setSize(innerWidth,innerHeight);renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.outputEncoding=THREE.sRGBEncoding;renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=.72;renderer.shadowMap.enabled=true;document.body.appendChild(renderer.domElement);
scene.add(new THREE.HemisphereLight(0xffffff,0x557744,.75));const sun=new THREE.DirectionalLight(0xffffff,1.05);sun.position.set(-30,60,25);sun.castShadow=true;sun.shadow.mapSize.set(1024,1024);scene.add(sun);const ground=new THREE.Mesh(new THREE.PlaneGeometry(180,180),new THREE.MeshLambertMaterial({color:0x78a94f}));ground.rotation.x=-Math.PI/2;ground.receiveShadow=true;scene.add(ground);
const loader=new THREE.GLTFLoader();let world=new THREE.Group();scene.add(world);
function setMaterial(mesh,color,roughness=.85){mesh.material=new THREE.MeshStandardMaterial({color,roughness,metalness:0,side:THREE.DoubleSide});mesh.castShadow=true;mesh.receiveShadow=true;mesh.frustumCulled=false;mesh.visible=true}
function loadAsset(url,scale,x,z,cb){loader.load(url,g=>{const r=g.scene||g.scenes[0];r.scale.setScalar(scale);r.position.set(x,0,z);r.updateMatrixWorld(true);const b=new THREE.Box3().setFromObject(r);r.position.y-=b.min.y;r.updateMatrixWorld(true);r.traverse(o=>{if(o.isMesh){o.visible=true;o.castShadow=true;o.receiveShadow=true;o.frustumCulled=false}});world.add(r);if(cb)cb(r)},undefined,e=>{console.error('Asset failed',url,e);document.getElementById('status').textContent='Asset load failed: '+url})}
function makeFallbackBase(){const g=new THREE.Group(),sand=new THREE.MeshLambertMaterial({color:0xd5a55f}),teal=new THREE.MeshLambertMaterial({color:0x35c6d0}),stone=new THREE.MeshLambertMaterial({color:0xbda37b});function box(w,h,d,m,x,y,z){const o=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),m);o.position.set(x,y,z);o.castShadow=o.receiveShadow=true;g.add(o)}box(12,.5,12,stone,0,.25,0);box(9,5.5,7,sand,0,3,-.5);for(const p of [[-5,-3.5],[-5,3],[5,-3.5],[5,3]]){box(2.8,6,2.8,sand,p[0],3,p[1]);const d=new THREE.Mesh(new THREE.SphereGeometry(1.35,16,8,0,Math.PI*2,0,Math.PI/2),teal);d.scale.y=.7;d.position.set(p[0],6.5,p[1]);d.castShadow=true;g.add(d)}scene.add(g);return g}
const fallback=makeFallbackBase();
// The Blender-processed GLB contains the authoritative materials. Do not replace them in Three.js.
loadAsset('assets/town-center/stage1.glb',7.2,0,0,r=>{fallback.visible=false;document.getElementById('status').textContent='Town Center loaded';setTimeout(()=>document.getElementById('status').remove(),1800)});
const resourceGroup=new THREE.Group();scene.add(resourceGroup);
function addResource(url,x,z,scale,type){loader.load(url,g=>{const r=g.scene||g.scenes[0];r.scale.setScalar(scale);r.position.set(x,0,z);r.updateMatrixWorld(true);const b=new THREE.Box3().setFromObject(r);r.position.y-=b.min.y;r.updateMatrixWorld(true);r.traverse(o=>{if(o.isMesh){const c=type==='tree'?(o.position.y>1.5?0x4f8f3d:0x6b4326):0x8a7660;setMaterial(o,c,.95);if(type==='gold')o.material=new THREE.MeshStandardMaterial({color:0xb58a32,roughness:.38,metalness:.55,side:THREE.DoubleSide});}});resourceGroup.add(r)},undefined,e=>console.error('Resource failed',url,e))}
for(let i=0;i<18;i++){const a=i*Math.PI*2/18,r=28+(i%3)*5;addResource('assets/resources/tree.glb',Math.cos(a)*r,Math.sin(a)*r,.75,'tree')}for(let i=0;i<6;i++){const a=i*Math.PI*2/6+.35,r=42;addResource('assets/resources/gold-vein.glb',Math.cos(a)*r,Math.sin(a)*r,.9,'gold')}
let angle=.65,dist=32,height=25;function cam(){camera.position.set(Math.sin(angle)*dist,height,Math.cos(angle)*dist);camera.lookAt(0,4,0)}cam();let drag=false,lastX=0;renderer.domElement.addEventListener('pointerdown',e=>{if(e.button===1||e.button===0){drag=true;lastX=e.clientX}});addEventListener('pointerup',()=>drag=false);addEventListener('pointermove',e=>{if(drag){angle+=(e.clientX-lastX)*.008;lastX=e.clientX;cam()}});addEventListener('wheel',e=>{dist=Math.max(12,Math.min(80,dist+e.deltaY*.04));cam()});addEventListener('keydown',e=>{if(e.key==='ArrowLeft')angle+=.1;if(e.key==='ArrowRight')angle-=.1;if(e.key==='ArrowUp')height=Math.min(70,height+2);if(e.key==='ArrowDown')height=Math.max(8,height-2);cam()});addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});function loop(){requestAnimationFrame(loop);renderer.render(scene,camera)}loop();</script></body></html>
