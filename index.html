<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>Realm Wars 3D — RTS</title><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#78c8e5;font-family:monospace}#game{position:fixed;inset:0}canvas{display:block}#resources{position:fixed;top:0;left:0;right:0;height:42px;padding:8px 14px;background:rgba(20,16,12,.92);color:#fff;z-index:5;font-size:14px;white-space:nowrap}.status{position:fixed;left:50%;top:48px;transform:translateX(-50%);z-index:6;color:#fff;background:rgba(0,0,0,.72);padding:7px 11px;border-radius:5px;font-size:11px;pointer-events:none;white-space:nowrap}.msg{position:fixed;left:50%;top:82px;transform:translateX(-50%);z-index:6;color:#ddd;background:rgba(0,0,0,.48);padding:4px 8px;border-radius:4px;font-size:10px;pointer-events:none}#ui{position:fixed;left:0;right:0;bottom:0;min-height:112px;padding:10px;display:flex;gap:8px;flex-wrap:wrap;align-content:center;background:rgba(25,18,12,.94);border-top:3px solid #8b6f47;z-index:5}.btn{background:#6b5335;color:#fff;border:2px solid #a98655;border-radius:4px;padding:10px 14px;font:14px monospace;touch-action:manipulation}.btn:active{background:#8b6f47}</style></head><body><div id="game"></div><div id="resources">🪵 <span id="rWood">250</span> &nbsp; 🍎 <span id="rFood">250</span> &nbsp; 🪙 <span id="rGold">150</span> &nbsp; 👥 <span id="rPop">3</span>/50</div><div id="status" class="status">Town Center: initializing…</div><div class="msg">Drag to rotate • pinch/wheel to zoom • tap to select</div><div id="ui"><button class="btn" onclick="trainUnit('villager')">Villager · 50F</button><button class="btn" onclick="trainUnit('militia')">Militia · 60F 20G</button><button class="btn" onclick="trainUnit('archer')">Archer · 30W 40G</button><button class="btn" onclick="trainUnit('knight')">Knight · 80F 70G</button></div><script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script><script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script><script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/DRACOLoader.js"></script><script>
const statusEl=document.getElementById('status');
const scene=new THREE.Scene();scene.background=new THREE.Color(0x78c8e5);scene.fog=new THREE.Fog(0x78c8e5,90,220);
const camera=new THREE.OrthographicCamera(-18,18,18,-18,.1,500);let zoom=18,angle=Math.PI*.25,dist=30;function updateCamera(){const x=Math.sin(angle)*dist,z=Math.cos(angle)*dist;camera.position.set(x,dist*.72,z);camera.lookAt(0,0,0);camera.zoom=18/zoom;camera.updateProjectionMatrix()}updateCamera();
const renderer=new THREE.WebGLRenderer({antialias:true,powerPreference:'high-performance'});renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.setSize(innerWidth,innerHeight);renderer.outputEncoding=THREE.sRGBEncoding;renderer.shadowMap.enabled=true;document.getElementById('game').appendChild(renderer.domElement);
scene.add(new THREE.HemisphereLight(0xddeeff,0x667755,.65));const sun=new THREE.DirectionalLight(0xffffff,.7);sun.position.set(30,50,20);sun.castShadow=true;sun.shadow.mapSize.set(1024,1024);scene.add(sun);const ground=new THREE.Mesh(new THREE.PlaneGeometry(220,220),new THREE.MeshLambertMaterial({color:0x79a45a}));ground.rotation.x=-Math.PI/2;ground.receiveShadow=true;scene.add(ground);
const RES={wood:250,food:250,gold:150},PLAYER=0,ENEMY=1;let units=[],buildings=[],resourceNodes=[],selected=[],pop=3;
const TYPES={villager:{hp:40,dmg:3,range:0,speed:.08,cost:{food:50},color:0x4a90d9,size:.9},militia:{hp:60,dmg:8,range:0,speed:.09,cost:{food:60,gold:20},color:0xd94a4a,size:1},archer:{hp:45,dmg:6,range:8,speed:.095,cost:{wood:30,gold:40},color:0x7ad94a,size:.9},knight:{hp:120,dmg:14,range:0,speed:.11,cost:{food:80,gold:70},color:0xd9a44a,size:1.15}};
const FACTIONS={0:{accent:0x3f5fa8},1:{accent:0xa83d46}},INITIAL={wall:0xc9b07a,stone:0x8c8470,roof:0x9a6a3a,wood:0x5a3925,gold:0xc29a3d,metal:0x6f5435};
function paintMaterials(root,owner){const f=FACTIONS[owner]||FACTIONS[PLAYER],seen=new Map();root.traverse(o=>{if(!o.isMesh||!o.material)return;const src=Array.isArray(o.material)?o.material:[o.material];o.material=src.map(old=>{if(!old)return old;let m=seen.get(old);if(!m){m=old.clone();seen.set(old,m);const n=(m.name||'').toLowerCase();if(n.includes('wall')||n.includes('plaster'))m.color.setHex(INITIAL.wall);else if(n.includes('stone'))m.color.setHex(INITIAL.stone);else if(n.includes('roof')||n.includes('thatch'))m.color.setHex(INITIAL.roof);else if(n.includes('wood')||n.includes('timber'))m.color.setHex(INITIAL.wood);else if(n.includes('gold')||n.includes('ore'))m.color.setHex(INITIAL.gold);else if(n.includes('metal'))m.color.setHex(INITIAL.metal);else if(n.includes('accent')||n.includes('banner')||n.includes('flag'))m.color.setHex(f.accent);m.needsUpdate=true}return m});o.visible=true;o.frustumCulled=false;o.castShadow=true;o.receiveShadow=true})}
const loader=new THREE.GLTFLoader();const draco=new THREE.DRACOLoader();draco.setDecoderPath('https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/libs/draco/');draco.setDecoderConfig({type:'js'});loader.setDRACOLoader(draco);let townCenterTemplate=null,townCenterLoadPromise=null;
function loadTownCenterTemplate(){if(townCenterLoadPromise)return townCenterLoadPromise;statusEl.textContent='Town Center: downloading…';townCenterLoadPromise=new Promise((resolve,reject)=>{const url='assets/town-center/stage1.glb?v=6396183';let settled=false;const fail=e=>{if(settled)return;settled=true;const msg=e&&e.message?e.message:String(e||'unknown error');reject(new Error(msg+' [stage1.glb / Draco]'))};const timeout=setTimeout(()=>fail(new Error('GLB load timeout after 20s')),20000);loader.load(url,g=>{if(settled)return;clearTimeout(timeout);try{const root=g.scene;root.visible=true;root.scale.setScalar(1);root.updateMatrixWorld(true);const box=new THREE.Box3().setFromObject(root),size=box.getSize(new THREE.Vector3()),footprint=Math.max(size.x,size.z);if(!isFinite(footprint)||footprint<=0)throw new Error('invalid GLB bounds '+JSON.stringify({x:size.x,y:size.y,z:size.z}));root.scale.multiplyScalar(12/footprint);root.updateMatrixWorld(true);const b2=new THREE.Box3().setFromObject(root),center=b2.getCenter(new THREE.Vector3());root.position.x-=center.x;root.position.z-=center.z;root.position.y-=b2.min.y;root.updateMatrixWorld(true);townCenterTemplate=root;settled=true;statusEl.textContent='Town Center: template ready';resolve(root)}catch(e){fail(e)}},xhr=>{const loaded=xhr&&Number.isFinite(xhr.loaded)?xhr.loaded:0,total=xhr&&Number.isFinite(xhr.total)?xhr.total:0;statusEl.textContent=total>0?'Town Center: downloading '+Math.round(loaded/total*100)+'%':'Town Center: downloading '+Math.round(loaded/1024)+' KB'},fail)});return townCenterLoadPromise}
async function makeTC(x,z,owner){const b={x,z,hp:1000,owner,isBuilding:true,radius:7,mesh:null};buildings.push(b);try{const template=await loadTownCenterTemplate();const root=template.clone(true);root.position.x+=x;root.position.z+=z;root.userData.building=b;scene.add(root);b.mesh=root;paintMaterials(root,owner);statusEl.textContent=owner===PLAYER?'Town Center: ready':'Enemy Town Center: ready';if(owner===PLAYER)setTimeout(()=>statusEl.style.display='none',1200)}catch(e){console.error('Town Center GLB load failed',e);statusEl.textContent='Town Center: FAILED — '+(e&&e.message?e.message:'unknown error')}}
function loadResource(path,x,z,targetHeight){loader.load(path+'?v=6396183',g=>{const r=g.scene;r.position.set(x,0,z);r.updateMatrixWorld(true);const box=new THREE.Box3().setFromObject(r),size=box.getSize(new THREE.Vector3());if(isFinite(size.y)&&size.y>0)r.scale.multiplyScalar(targetHeight/size.y);r.updateMatrixWorld(true);const b2=new THREE.Box3().setFromObject(r);r.position.y-=b2.min.y;r.traverse(o=>{if(o.isMesh){o.visible=true;o.frustumCulled=false;o.castShadow=true;o.receiveShadow=true}});scene.add(r)},undefined,e=>console.warn('Resource failed',path,e))}
function makeTree(x,z){loadResource('assets/resources/tree.glb',x,z,5);resourceNodes.push({x,z,amt:100,type:'wood'})}function makeGold(x,z){loadResource('assets/resources/gold-vein.glb',x,z,2);resourceNodes.push({x,z,amt:400,type:'gold'})}
makeTC(0,0,PLAYER);makeTC(32,-24,ENEMY);for(let i=0;i<12;i++)makeTree((Math.random()-.5)*100,(Math.random()-.5)*80);for(let i=0;i<4;i++)makeGold((Math.random()-.5)*90,(Math.random()-.5)*70);
function spawnUnit(type,owner,x,z){const t=TYPES[type],m=new THREE.Mesh(new THREE.SphereGeometry(t.size*.7,12,12),new THREE.MeshLambertMaterial({color:owner===PLAYER?t.color:0xc0392b}));m.position.set(x,t.size,z);m.castShadow=true;scene.add(m);units.push({mesh:m,type,owner,x,z,hp:t.hp,maxHp:t.hp,target:null,gather:null,cooldown:0});if(owner===PLAYER){pop++;updateUI()}}for(let i=0;i<3;i++)spawnUnit('villager',PLAYER,-3+i*2,4);
const ring=new THREE.Mesh(new THREE.RingGeometry(1.3,1.65,24),new THREE.MeshBasicMaterial({color:0xffff88,side:THREE.DoubleSide}));ring.rotation.x=-Math.PI/2;ring.visible=false;scene.add(ring);const ray=new THREE.Raycaster(),mouse=new THREE.Vector2();function groundPoint(e){const r=renderer.domElement.getBoundingClientRect();mouse.x=((e.clientX-r.left)/r.width)*2-1;mouse.y=-((e.clientY-r.top)/r.height)*2+1;ray.setFromCamera(mouse,camera);const h=ray.intersectObject(ground)[0];return h?h.point:null}let dragging=false,lastX=0,lastY=0;renderer.domElement.addEventListener('pointerdown',e=>{dragging=false;lastX=e.clientX;lastY=e.clientY});renderer.domElement.addEventListener('pointermove',e=>{if(e.buttons===1){const dx=e.clientX-lastX,dy=e.clientY-lastY;if(Math.abs(dx)+Math.abs(dy)>3)dragging=true;if(dragging){angle-=dx*.008;lastX=e.clientX;lastY=e.clientY;updateCamera()}}});renderer.domElement.addEventListener('pointerup',e=>{if(dragging)return;const p=groundPoint(e);if(!p)return;selected=units.filter(u=>u.owner===PLAYER&&Math.hypot(u.x-p.x,u.z-p.z)<2.5);if(selected.length){ring.position.set(selected[0].x,.06,selected[0].z);ring.visible=true}else ring.visible=false});renderer.domElement.addEventListener('wheel',e=>{zoom=Math.max(9,Math.min(30,zoom+e.deltaY*.012));updateCamera()},{passive:true});renderer.domElement.addEventListener('contextmenu',e=>e.preventDefault());
function updateUI(){rWood.textContent=Math.floor(RES.wood);rFood.textContent=Math.floor(RES.food);rGold.textContent=Math.floor(RES.gold);rPop.textContent=pop}function trainUnit(type){const t=TYPES[type];if(pop>=50||Object.keys(t.cost).some(k=>RES[k]<t.cost[k]))return;Object.keys(t.cost).forEach(k=>RES[k]-=t.cost[k]);const tc=buildings.find(b=>b.owner===PLAYER);if(tc)spawnUnit(type,PLAYER,tc.x+6,tc.z+5)}function animate(){requestAnimationFrame(animate);renderer.render(scene,camera)}animate();addEventListener('resize',()=>{renderer.setSize(innerWidth,innerHeight);updateCamera()});updateUI();</script></body></html>
