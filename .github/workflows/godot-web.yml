name: Godot Web Build

on:
  push:
    branches: [godot-migration]
    paths:
      - 'Godot/**'
      - 'assets-src/**'
      - 'blender/**'
      - '.github/workflows/godot-web.yml'
  pull_request:
    branches: [godot-migration]
    paths:
      - 'Godot/**'
      - 'assets-src/**'
      - 'blender/**'
      - '.github/workflows/godot-web.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: godot-web-${{ github.ref }}
  cancel-in-progress: true

env:
  GODOT_VERSION: '4.5.2'
  BLENDER_VERSION: '4.5.13'
  GODOT_DIR: Godot
  OUTPUT_DIR: build/web

jobs:
  build-web:
    name: Playable Web build
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Install Godot
        shell: bash
        run: |
          set -euo pipefail
          curl -fL --retry 3 "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip" -o /tmp/godot.zip
          unzip -q /tmp/godot.zip -d /tmp/godot
          install -m 0755 "/tmp/godot/Godot_v${GODOT_VERSION}-stable_linux.x86_64" /usr/local/bin/godot
          godot --version

      - name: Install Web export templates
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable"
          curl -fL --retry 3 "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_export_templates.tpz" -o /tmp/templates.tpz
          unzip -q /tmp/templates.tpz -d /tmp/templates
          find /tmp/templates -type f -name 'web_nothreads_release.zip' -exec cp {} "$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable/" \;
          test -f "$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable/web_nothreads_release.zip"

      - name: Install Blender
        shell: bash
        run: |
          set -euo pipefail
          url="https://download.blender.org/release/Blender4.5/blender-${BLENDER_VERSION}-linux-x64.tar.xz"
          curl -fL --retry 3 "$url" -o /tmp/blender.tar.xz
          mkdir -p /tmp/blender
          tar -xJf /tmp/blender.tar.xz -C /tmp/blender --strip-components=1
          install -m 0755 /tmp/blender/blender /usr/local/bin/blender
          blender --version

      - name: Rebuild Godot-compatible GLBs
        shell: bash
        run: |
          set -euo pipefail
          blender -b --python blender/process_assets.py 2>&1 | tee /tmp/blender-assets.log
          mkdir -p "$GODOT_DIR/assets"
          cp -R assets/. "$GODOT_DIR/assets/"
          test -s "$GODOT_DIR/assets/town-center/stage1.glb"
          test -s "$GODOT_DIR/assets/resources/tree.glb"
          test -s "$GODOT_DIR/assets/resources/gold-vein.glb"

      - name: Import project
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$GODOT_DIR/$OUTPUT_DIR"
          godot --headless --path "$GODOT_DIR" --editor --quit 2>&1 | tee /tmp/godot-import.log
          if grep -qE '^ERROR:' /tmp/godot-import.log; then
            echo 'Godot reported import errors.'
            exit 1
          fi

      - name: Validate project
        shell: bash
        run: |
          set -euo pipefail
          godot --headless --path "$GODOT_DIR" --check-only 2>&1 | tee /tmp/godot-check.log
          if grep -qE 'SCRIPT ERROR:|Parse Error:|ERROR: Failed to load script' /tmp/godot-check.log; then
            echo 'Godot project validation reported script errors.'
            exit 1
          fi

      - name: Export Web
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$GODOT_DIR/$OUTPUT_DIR"
          godot --headless --path "$GODOT_DIR" --export-release Web "$OUTPUT_DIR/RealmWars3D.html" 2>&1 | tee /tmp/godot-export.log
          if grep -qE 'ERROR:|SCRIPT ERROR:|Parse Error:' /tmp/godot-export.log; then
            echo 'Godot export reported errors.'
            exit 1
          fi
          test -s "$GODOT_DIR/$OUTPUT_DIR/RealmWars3D.html"
          find "$GODOT_DIR/$OUTPUT_DIR" -maxdepth 1 -type f -printf '%f %s bytes\n' | sort

      - name: Upload playable Web build
        uses: actions/upload-artifact@v4
        with:
          name: RealmWars3D-Web-${{ github.sha }}
          path: Godot/build/web
          if-no-files-found: error
          retention-days: 14
