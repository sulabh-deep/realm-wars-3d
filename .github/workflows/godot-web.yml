name: Godot Web Build

on:
  push:
    branches: [godot-migration]
    paths:
      - 'Godot/**'
      - '.github/workflows/godot-web.yml'
      - '.github/workflows/deploy-pages.yml'
  pull_request:
    branches: [godot-migration]
    paths:
      - 'Godot/**'
      - '.github/workflows/godot-web.yml'
      - '.github/workflows/deploy-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: godot-web-${{ github.ref }}
  cancel-in-progress: true

env:
  GODOT_VERSION: '4.5.2'
  GODOT_DIR: Godot
  OUTPUT_DIR: build/web

jobs:
  build-web:
    name: Build and deploy Web
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Install Godot
        shell: bash
        run: |
          set -euo pipefail
          curl -fL --retry 3 "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip" -o /tmp/godot.zip
          unzip -q /tmp/godot.zip -d /tmp/godot
          install -m 0755 "/tmp/godot/Godot_v${GODOT_VERSION}-stable_linux.x86_64" /usr/local/bin/godot
          godot --version

      - name: Install Web export templates
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable"
          curl -fL --retry 3 "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_export_templates.tpz" -o /tmp/templates.tpz
          unzip -q /tmp/templates.tpz -d /tmp/templates
          find /tmp/templates -type f -name 'web_nothreads_release.zip' -exec cp {} "$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable/" \;
          test -f "$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable/web_nothreads_release.zip"

      - name: Exclude incompatible compressed GLBs for Web CI
        shell: bash
        run: |
          set -euo pipefail
          rm -f "$GODOT_DIR"/assets/town-center/*.glb
          rm -f "$GODOT_DIR"/assets/resources/*.glb
          echo 'Using procedural fallback visuals for the CI web build.'

      - name: Import project
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$GODOT_DIR/$OUTPUT_DIR"
          timeout 300 godot --headless --path "$GODOT_DIR" --editor --quit 2>&1 | tee /tmp/godot-import.log
          if grep -qE '^ERROR:|SCRIPT ERROR:|Parse Error:|ERROR: Failed to load script' /tmp/godot-import.log; then
            echo 'Godot reported import/script errors.'
            exit 1
          fi

      - name: Export Web
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$GODOT_DIR/$OUTPUT_DIR"
          timeout 600 godot --headless --path "$GODOT_DIR" --export-release Web "$OUTPUT_DIR/index.html" 2>&1 | tee /tmp/godot-export.log
          if grep -qE 'SCRIPT ERROR:|Parse Error:|ERROR: Failed to load script' /tmp/godot-export.log; then
            echo 'Godot export reported script errors.'
            exit 1
          fi
          test -s "$GODOT_DIR/$OUTPUT_DIR/index.html"
          find "$GODOT_DIR/$OUTPUT_DIR" -maxdepth 1 -type f -printf '%f %s bytes\n' | sort

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: Godot/build/web

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
