name: Process 3D Assets

on:
  workflow_dispatch:
  push:
    paths:
      - 'assets-src/**/*.glb'
      - 'blender/**'
      - '.github/workflows/blender-assets.yml'

permissions:
  contents: write

jobs:
  process-assets:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Blender
        uses: blender-actions/setup-blender@v2
        with:
          version: '4.5.3'

      - name: Process GLB assets
        run: |
          mkdir -p assets
          blender -b --python blender/process_assets.py

      - name: Commit processed assets
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets
          if git diff --cached --quiet; then
            echo 'No processed asset changes.'
          else
            git commit -m 'Process 3D assets with Blender'
            git push
          fi
