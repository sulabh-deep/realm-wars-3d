name: Unity 6 WebGL CI

on:
  push:
    branches:
      - main
      - unity6-migration
    paths:
      - 'Unity6/**'
      - 'assets/**'
      - 'assets-src/**'
      - '.github/workflows/unity-ci.yml'
  pull_request:
    paths:
      - 'Unity6/**'
      - 'assets/**'
      - 'assets-src/**'
      - '.github/workflows/unity-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: unity6-webgl-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  UNITY_VERSION: 6000.0.65f1
  PROJECT_PATH: Unity6

jobs:
  webgl:
    name: WebGL playable build
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Cache Unity Library
        uses: actions/cache@v4
        with:
          path: Unity6/Library
          key: Unity6-Library-WebGL-${{ runner.os }}-${{ hashFiles('Unity6/Assets/**', 'Unity6/Packages/**', 'Unity6/ProjectSettings/**', 'assets/**') }}
          restore-keys: |
            Unity6-Library-WebGL-${{ runner.os }}-
            Unity6-Library-

      - name: Build WebGL
        uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          projectPath: ${{ env.PROJECT_PATH }}
          unityVersion: ${{ env.UNITY_VERSION }}
          targetPlatform: WebGL
          buildMethod: RealmWars3D.Editor.CIBuild.BuildWebGL
          versioning: None

      - name: Upload WebGL build
        uses: actions/upload-artifact@v4
        with:
          name: RealmWars3D-WebGL-${{ github.sha }}
          path: build/WebGL
          if-no-files-found: error
          retention-days: 14

  summary:
    name: CI summary
    needs: [webgl]
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Check build result
        run: |
          echo "WebGL: ${{ needs.webgl.result }}"
          test "${{ needs.webgl.result }}" = "success"
